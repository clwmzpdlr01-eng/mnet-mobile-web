
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<link rel="manifest" href="manifest.webmanifest">
<title>Mnet Video Saver</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151f33;--line:#2b3a56;--muted:#a5b2c8;--accent:#6f8cff}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:var(--bg);color:#f5f7ff;font-family:system-ui,sans-serif}
main{max-width:520px;margin:auto}
.head{text-align:center;padding:26px 8px}
.logo{width:52px;height:52px;border-radius:17px;background:#6f8cff;display:grid;place-items:center;margin:auto auto 13px;font-size:24px}
h1{font-size:23px;margin:0 0 6px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:650;font-size:13px;margin-bottom:9px}
input{width:100%;padding:14px;border:1px solid #405071;border-radius:12px;background:#0d1628;color:white;font:inherit;font-size:14px}
button{width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);color:white;font-weight:700;font-size:14px;margin-top:10px}
button.secondary{background:#263550;border:1px solid #405071}
.result{background:#0d1628;border:1px solid #34435f;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;overflow-wrap:anywhere;line-height:1.7}
.note{font-size:12px;line-height:1.65;color:#c4cee0}
.hidden{display:none}
</style>
</head>
<body>
<main>
<header class="head">
<div class="logo">▶</div>
<h1>Mnet Video Saver</h1>
<div class="muted">갤럭시 모바일 웹앱 · 접근 진단 테스트</div>
</header>

<section class="card">
<label for="url">Mnet Plus 게시물 주소</label>
<input id="url" type="url" inputmode="url"
value="https://artist.mnetplus.world/main/stg/hrtzwav/story/feed/6aee056d1150e57a41f607c3"
placeholder="게시물 URL 붙여넣기">

<button id="check">게시물 ID 확인</button>
<div id="result" class="result hidden"></div>
<button id="open" class="secondary">Chrome에서 게시물 열기</button>
</section>

<section class="card">
<b>브라우저 접근 진단</b>
<div class="note">현재 웹앱에서 Mnet Plus 페이지에 접근할 수 있는지 확인해.</div>
<button id="diagnose">접근 테스트 시작</button>
<div id="diagnosis" class="result hidden"></div>
</section>

<section class="card">
<div class="note">
<b>진단 결과 안내</b><br>
• 성공: 브라우저에서 페이지 응답을 읽을 수 있음<br>
• CORS 오류: 다른 도메인의 접근이 브라우저에서 차단됨<br>
• 네트워크 오류: 연결 또는 로그인 환경 확인 필요<br><br>
이 테스트는 페이지 접근만 확인하며 영상 스트림 접근이나 추출 가능 여부를 증명하지는 않아.
</div>
</section>
 
<section class="card">
  <b>영상 조각 파일 확인</b>
  <div class="note">
    직접 선택한 영상·오디오 조각 파일의 목록과 용량을 확인합니다.
  </div>

  <input
    id="segments"
    type="file"
    multiple
    accept=".mp4,.m4s,.mpd,.m4a"
    style="margin-top:12px"
  >

  <button id="scan">선택한 파일 확인</button>
  <div id="segmentResult" class="result hidden"></div>
</section>

</main>

<script>
const $=id=>document.getElementById(id);
let postId="";

$("scan").addEventListener("click",()=>{
  const files=[...$("segments").files];
  const out=$("segmentResult");

  out.classList.remove("hidden");

  if(!files.length){
    out.textContent="선택된 파일이 없습니다.";
    return;
  }

  const total=files.reduce((sum,f)=>sum+f.size,0);
  const video=files.filter(f=>/video|orivideo/i.test(f.name));
  const audio=files.filter(f=>/audio|oriaudio/i.test(f.name));

  const size=n=>(n/1024/1024).toFixed(2)+" MB";

  out.textContent=
    `전체 파일: ${files.length}개\n`+
    `영상 관련 파일명: ${video.length}개\n`+
    `오디오 관련 파일명: ${audio.length}개\n`+
    `전체 용량: ${size(total)}\n\n`+
    files.map(f=>`${f.name} (${size(f.size)})`).join("\n");
});

function parse(){
 try{
  const u=new URL($("url").value.trim());
  const id=u.pathname.split("/").filter(Boolean).at(-1);
  if(!/^[a-zA-Z0-9_-]{6,}$/.test(id))
   throw Error("게시물 ID를 찾지 못했어요.");
  postId=id;
  $("result").textContent=`게시물 ID: ${id} · 파일명 기준: ${id}.mp4`;
 }catch(e){
  postId="";
  $("result").textContent=e.message||"올바른 URL을 입력해 주세요.";
 }
 $("result").classList.remove("hidden");
}

$("check").addEventListener("click",parse);

$("open").addEventListener("click",()=>{
 try{
  const u=new URL($("url").value.trim());
  if(!/^https:\/\/(artist\.)?mnetplus\.world$/.test(u.origin))throw Error();
  window.open(u.href,"_blank");
 }catch(e){
  alert("유효한 Mnet Plus 게시물 주소를 입력해 주세요.");
 }
});

$("diagnose").addEventListener("click",async()=>{
 const out=$("diagnosis");
 out.classList.remove("hidden");
 out.textContent="테스트 중...";
 try{
  const u=new URL($("url").value.trim());
  if(!/^https:\/\/(artist\.)?mnetplus\.world$/.test(u.origin))
   throw Error("Mnet Plus 주소를 확인해 주세요.");

  const response=await fetch(u.href,{
   method:"GET",
   mode:"cors",
   credentials:"include"
  });

  out.textContent=
   `응답 확인 성공\nHTTP 상태: ${response.status}\n`+
   `응답 URL: ${response.url}\n\n`+
   "페이지 응답을 읽을 수 있습니다. 영상 접근 가능 여부는 별도 확인이 필요합니다.";
 }catch(e){
  out.textContent=
   `페이지 접근 실패\n오류: ${e.message}\n\n`+
   "CORS 또는 브라우저 보안 정책으로 차단됐을 수 있습니다.";
 }
});

if("serviceWorker" in navigator && location.protocol.startsWith("http"))
 navigator.serviceWorker.register("./sw.js").catch(()=>{});

parse();
</script>
</body>
</html>
